<main id="main" tabindex="-1"></main></div><div id="toast" role="status" aria-live="polite"></div><noscript>Ative o JavaScript no navegador para utilizar o simulador.</noscript><script>// Conteúdo opcional: sem notação matemática, com distinção entre escolas e modelos.
const LESSONS={
 monetary:{school:'Tradição novo-keynesiana · preços com ajuste lento',
 story:[
 'Imagine uma economia em que as famílias e as empresas querem gastar mais do que a capacidade produtiva permite atender sem pressão sobre os preços. O Banco Central pode elevar o juro nominal. Se a inflação esperada não subir na mesma proporção, o custo real de antecipar gastos aumenta. No mecanismo representado aqui, a demanda enfraquece e a pressão inflacionária diminui.',
 'A decisão inicial não encerra a história. A atividade mais fraca afeta a inflação, e a inflação menor modifica a reação prevista para o Banco Central. Por isso, o juro final, a atividade e a inflação precisam ser compatíveis entre si. A explicação em etapas ajuda a entender essas dependências, mas o programa determina as três variáveis conjuntamente.',
 'Um encarecimento de insumos produz um problema diferente: pressiona os preços mesmo sem aquecimento da demanda. A reação de juros pode conter parte da inflação, ao custo de enfraquecer a atividade. Essa combinação ilustra o conflito de objetivos provocado por um choque de oferta. Não é correto interpretar todo aumento de preços como sinal de excesso de consumo.',
 'Este laboratório pertence à tradição novo-keynesiana, que admite ajustes lentos de preços. Não é um modelo da escola clássica de preços flexíveis. A comparação entre as tradições está no papel atribuído à demanda e à política monetária no curto prazo. Aqui as expectativas são informadas pelo usuário: não se calcula como elas aprenderiam ou mudariam ao longo do tempo.'
 ],scope:'Os controles de choque monetário e de custos mostram um impacto isolado, com expectativas dadas. Não há duração ou trajetória neste laboratório. Alterar a resposta do Banco Central, a meta ou a sensibilidade da demanda muda a regra ou a estrutura do mecanismo.',
 watch:'Comece pelo choque de custos. Observe simultaneamente inflação e hiato. Depois aumente a resposta do Banco Central, mantendo o mesmo choque, e compare o custo em atividade.',
 glossary:[['Hiato','Distância entre a produção atual e a produção potencial. Um hiato negativo indica atividade abaixo desse referencial.'],['Juro real','Juro nominal descontado da inflação esperada: o custo em poder de compra de transferir recursos entre períodos.'],['Choque de custos','Pressão sobre preços que não é explicada pelo hiato neste pequeno modelo.']],
 traps:['Inflação menor não significa necessariamente queda do nível de preços; pode significar preços ainda subindo, porém mais devagar.','Uma taxa de juros mais alta pode coexistir com inflação alta. Essa associação, por si só, não prova que juros causaram a inflação.'],
 question:'Se os custos aumentarem, conter mais a inflação será gratuito em termos de atividade?',answer:'Não neste mecanismo. Uma reação monetária mais forte contém parte da pressão de preços por meio de uma demanda mais fraca. Compare inflação e hiato diante do mesmo choque. O tamanho da troca depende das hipóteses escolhidas.',
 source:['Federal Reserve de Minneapolis · modelos macroeconômicos','https://www.minneapolisfed.org/article/2010/modern-macroeconomic-models-as-tools-for-economic-policy'],shockKeys:['eps','u']},
 consumption:{school:'Escolha intertemporal · conexão com renda permanente',
 story:[
 'Pense em uma família que recebe uma renda extra hoje. Ela não precisa consumir todo esse dinheiro imediatamente: pode guardar uma parte para o ano seguinte. Também pode antecipar consumo por empréstimo quando espera receber mais no futuro. O objetivo do modelo é encontrar uma distribuição de consumo que respeite os recursos disponíveis e as preferências da família.',
 'O juro real é o preço dessa transferência no tempo. Quando ele aumenta, abrir mão de consumo hoje permite obter mais consumo amanhã. Entretanto, os juros também mudam o valor atual da renda futura. Por isso, o nível do consumo de hoje pode responder de maneiras diferentes, embora o consumo futuro se torne relativamente mais atraente.',
 'Compare um bônus recebido uma única vez com uma renda que também aumenta no segundo período. O primeiro eleva os recursos totais em menor medida. O segundo permite sustentar um consumo mais alto em ambos os períodos. Esse contraste ajuda a entender a suavização do consumo e a ideia de renda permanente: decisões dependem da renda esperada ao longo do tempo, e não apenas do que entrou na conta hoje.',
 'Uma família mais paciente valoriza mais o consumo futuro. Uma família que evita grandes diferenças de consumo entre períodos reage menos ao incentivo de substituir consumo presente por futuro. Essas são características das preferências, diferentes de receber um bônus. A conexão com renda permanente é conceitual: este exemplo de dois anos não reproduz a teoria completa de Friedman nem um modelo de ciclo de vida.'
 ],scope:'O choque de renda pode atingir somente o período presente ou os dois períodos. “Duradouro” aqui significa os dois anos representados, não uma renda infinita. Paciência, curvatura e alíquota de imposto podem ser alteradas separadamente.',
 watch:'Monte A com renda extra apenas hoje e B com o mesmo aumento também amanhã. Compare o consumo presente e a poupança, mantendo juros e preferências iguais.',
 glossary:[['Suavização do consumo','Distribuir recursos ao longo do tempo para evitar variações de consumo que a família considera indesejáveis.'],['Renda permanente','Capacidade de sustentar consumo com a renda esperada ao longo do tempo, em contraste com uma entrada excepcional.'],['Restrição de crédito','Limite para tomar empréstimos. Este laboratório permite empréstimos sem limite adicional, o que é uma hipótese forte.']],
 traps:['Poupar menos não significa necessariamente ser menos paciente: renda futura, riqueza e juros também afetam a decisão.','O efeito de um bônus neste modelo não deve ser aplicado diretamente a uma família que não consegue tomar crédito.'],
 question:'Dois aumentos iguais na renda de hoje elevam igualmente o consumo presente se apenas um deles também se repetir amanhã?',answer:'Não. Com as demais condições iguais, o aumento que também alcança a renda futura amplia mais os recursos totais da família e eleva mais seu consumo presente. O bônus pontual é repartido entre os dois períodos.',
 source:['Milton Friedman · hipótese da renda permanente, NBER','https://www.nber.org/books-and-chapters/theory-consumption-function/permanent-income-hypothesis'],shockKeys:['incomeShock'],durationKey:'incomeMode',durationLabel:'Duração do choque de renda',durationOptions:[['once','Somente hoje'],['permanent','Hoje e no próximo período']],pairMagnitude:20},
 growth:{school:'Crescimento neoclássico · modelo de Solow–Swan',
 story:[
 'Imagine trabalhadores usando máquinas para produzir. Uma parte do produto é consumida; outra é investida e amplia o conjunto de máquinas disponível no futuro. O investimento de hoje não muda o capital que já existia no início do ano. Ele muda o capital do próximo ano e, por esse caminho, a produção futura.',
 'Acumular máquinas ajuda, mas cada máquina adicional acrescenta menos produção quando os trabalhadores já dispõem de muito capital. Ao mesmo tempo, máquinas se desgastam e o aumento do número de trabalhadores dilui o capital por pessoa. O estado estacionário aparece quando o investimento consegue apenas compensar desgaste e diluição.',
 'Poupar mais exige consumir uma parcela menor da produção inicialmente. Depois, o capital adicional aumenta a produção. O consumo de longo prazo não cresce indefinidamente quando se aumenta a poupança: poupar em excesso também pode deixar poucos recursos para consumo. Isso distingue produzir mais de necessariamente viver melhor.',
 'Um ganho de produtividade de um ano aumenta a produção naquele ano e pode deixar máquinas adicionais, por meio do investimento. Assim, seu efeito não precisa acabar quando a produtividade volta ao normal. Um ganho permanente modifica também o destino de longo prazo. Neste modelo sem progresso tecnológico contínuo, mais poupança eleva o nível de produção por trabalhador, mas não sustenta seu crescimento para sempre.'
 ],scope:'O choque de produtividade pode durar apenas o ano inicial ou permanecer em todos os anos. A taxa de poupança, a tecnologia de referência, a depreciação e o crescimento do trabalho são condições persistentes. O capital inicial é uma condição de partida.',

 'A dívida pública é um estoque: ela acumula resultados de muitos anos. O saldo primário é um fluxo: mede se a receita supera a despesa antes do pagamento de juros. Um déficit primário acrescenta necessidade de financiamento. Um superávit permite reduzir essa necessidade, mas pode não bastar para impedir o aumento da dívida.',

function linear(A,b){ // Eliminação de Gauss com pivotamento parcial, sem inversão explícita.
 const n=b.length,M=A.map((r,i)=>[...r,b[i]]);
 for(let k=0;k<n;k++){
  let pivot=k;for(let j=k+1;j<n;j++)if(Math.abs(M[j][k])>Math.abs(M[pivot][k]))pivot=j;
  if(Math.abs(M[pivot][k])<1e-12)throw Error('Sistema singular: altere os parâmetros.');
  [M[k],M[pivot]]=[M[pivot],M[k]];const div=M[k][k];for(let j=k;j<=n;j++)M[k][j]/=div;
  for(let i=0;i<n;i++)if(i!==k){const a=M[i][k];for(let j=k;j<=n;j++)M[i][j]-=a*M[k][j];}
 }return M.map(r=>r[n]);
}

 definitions:'x: hiato do produto; π: inflação; i: juro nominal; πᵉ e xᵉ: expectativas dadas; rⁿ: juro natural; r*: intercepto real da política; d̄, ū, m̄: resíduos fixos de referência.',
 derive:'A IS é uma forma local da Euler com expectativa futura dada. Phillips aproxima a decisão de preços sob rigidez nominal. Taylor é uma regra de política. Ao substituir π = c + κx e a regra na IS, obtém-se x = [xᵉ + d̄ − (r* + π* + m̄ + ε + φπ(c−π*) − πᵉ − rⁿ)/σ] / [1 + (φπκ + φx)/σ]. O programa resolve o sistema por eliminação de Gauss, com pivotamento parcial. Taxas e inflação usam a mesma escala anual; κ e σ são coeficientes didáticos dessa escala, não parâmetros trimestrais estimados.',
 limits:'Trata-se de um corte estático inspirado no modelo Novo-Keynesiano, não de sua solução dinâmica sob expectativas racionais. π observado em 12 meses é uma âncora de nível, não a inflação prospectiva do modelo. Resíduos d̄=2,25, ū=0 e m̄=3,84 permitem x=0, π=4,44 e i=14 na referência. Eles não são choques estimados e não são recalibrados ao mover controles. r*=5 permanece fixo. Não há limite inferior de juros, inércia, canal de crédito ou avaliação de Blanchard–Kahn. Não inferir estabilidade dinâmica da solução estática.',
 sensitivity(p){const D=p.sigma+(p.freeze?0:p.phi*p.kappa+p.phix);return `∂x/∂ε = −1/D = ${F(-1/D)}; ∂π/∂ε = −κ/D = ${F(-p.kappa/D)}; D = σ + φπκ + φx (com juros fixos, D=σ). São efeitos de equilíbrio. Na regra, a derivada parcial ∂i/∂π = φπ = ${F(p.freeze?0:p.phi)} com x fixo. Na fórmula original do anexo seria 1+φπ; por isso o alerta φπ<1 estava inconsistente.`;}
 },
 consumption:{name:'Consumo e poupança',title:'Consumir hoje ou amanhã?',question:'Como juros reais, renda e paciência mudam a escolha entre dois períodos?',time:'Dois períodos · um ano cada',note:'Família hipotética, rendas em unidades reais. A Selic é uma referência de juro nominal; não representa a taxa de crédito ou de aplicação efetivamente acessível a uma família.',

 metrics:[['c0','Consumo presente','u. reais'],['c1','Consumo futuro','u. reais'],['s','Poupança líquida','u. reais'],['r','Juro real exato','% a.a.']],graph:{title:'Escolha ao longo das taxas reais',x:'Juro real (% a.a.)',key:'real',min:-5,max:20,metrics:[['q','Consumo futuro / presente'],['c0','Consumo presente (u. reais)']]},flow:['Juro nominal e inflação','Juro real','Euler + orçamento','C₀ e C₁'],
 definitions:'C₀ e C₁: consumo real; S: poupança líquida, negativa se há empréstimo; Y: renda real; τ: imposto proporcional; W₀: riqueza inicial; R=1+r: retorno real bruto; β: desconto; σ: curvatura CRRA.',

 growth:{name:'Capital e crescimento',title:'Poupar, acumular, convergir',question:'Por que mais investimento eleva o produto, mas não sustenta sozinho o crescimento por trabalhador?',time:'Dinâmica anual · por trabalhador',note:'Escalas normalizadas e parâmetros didáticos. Produtividade constante após a mudança. O capital inicial é predeterminado; uma poupança maior altera primeiro o investimento e só depois o capital.',

 metrics:[['y','Produto no ano 0','u./trab.'],['inv','Investimento no ano 0','u./trab.'],['finalY','Produto no horizonte','u./trab.'],['ks','Capital estacionário k*','u./trab.']],graph:{title:'Acumulação ao longo do tempo',x:'Anos após a mudança',metrics:[['y','Produto por trabalhador'],['k','Capital por trabalhador'],['c','Consumo por trabalhador'],['inv','Investimento por trabalhador'],['mpk','Produto marginal do capital']]},flow:['Produção','Poupança','Investimento','Capital seguinte','Produção ↺'],
 definitions:'k=K/L: capital por trabalhador; y=Y/L: produto por trabalhador; A: produtividade; α: elasticidade do produto ao capital; s: poupança; δ: depreciação; n: crescimento de L; c=(1−s)y; MPK=αAk^(α−1).',
 derive:'Dividindo Y=AK^αL^(1−α) por L, obtém-se y=Ak^α. Com Lₜ₊₁=(1+n)Lₜ, a acumulação implica kₜ₊₁=[(1−δ)kₜ+sAkₜ^α]/(1+n). No ponto fixo positivo, sAk*^α=(δ+n)k*, logo k*=[sA/(δ+n)]^[1/(1−α)]. Para s>0 e δ+n>0, a derivada no ponto fixo é [1−δ+α(δ+n)]/(1+n), entre 0 e 1 nos controles disponíveis.',
 limits:'Modelo de Solow sem crescimento tecnológico, capital humano ou otimização de poupança. Mais poupança aumenta o nível de longo prazo, não a taxa permanente de crescimento por trabalhador. A transição pode exceder o horizonte exibido. Se δ+n=0 e s>0, não existe ponto fixo finito; se s=δ=n=0, todo k é ponto fixo. Com s=0 e δ+n>0, k converge a zero. Dobrar K e L dobra Y, mantendo k e y constantes.',
 sensitivity(p,o){return `MPK₀ = αA₀k₀^(α−1) = ${F(o.mpk)}, com produtividade efetiva A₀=${F(o.At)}. Como α=${F(p.alpha)}<1, o produto marginal cai à medida que k aumenta. No estado estacionário interior, ∂ln k*/∂ln s = 1/(1−α) = ${F(1/(1-p.alpha))}.`;}

 metrics:[['b','Dívida inicial','% PIB'],['next','Dívida após 1 ano','% PIB'],['finalB','Dívida no horizonte','% PIB'],['stablePrimary','Primário que estabiliza b₀','% PIB']],graph:{title:'Dívida e resposta fiscal',x:'Anos após a mudança',metrics:[['b','Dívida líquida (% PIB)'],['primary','Saldo primário (% PIB)']]},flow:['Primário + juros','Estoque de dívida','Divisão pelo PIB','Regra fiscal','Primário ↺'],
 definitions:'bₜ: dívida líquida/PIB no fim do ano t; r e g: taxas reais do mesmo período; sₜ₊₁: superávit do ano seguinte / PIB do ano seguinte; φb: reação à dívida do início do período; b*: âncora da regra.',
 derive:'Em unidades reais, Bₜ₊₁=(1+r)Bₜ−SPₜ₊₁. Como Yₜ₊₁=(1+g)Yₜ e sₜ₊₁=SPₜ₊₁/Yₜ₊₁, bₜ₊₁=[(1+r)/(1+g)]bₜ−sₜ₊₁. O saldo estabilizador é exatamente sᵉ=[(r−g)/(1+g)]bₜ nesta convenção. Substituindo a regra, bₜ₊₁=λbₜ+φb b*−s̄, com λ=(1+r)/(1+g)−φb. O ponto fixo é (φb b*−s̄)/(1−λ) quando λ≠1. Convergência local e global desta recorrência linear exige |λ|<1.',
 limits:'Sem ajustes patrimoniais, variação cambial, privatizações ou mudanças no retorno dos ativos públicos. O saldo em 12 meses é usado como referência anual, não convertido a fluxo mensal. A DLSP pode tornar-se negativa (ativos líquidos) no modelo. A regra pode exigir saldos inviáveis, especialmente em horizontes longos: não é uma avaliação de sustentabilidade brasileira. b* na regra só coincide com o ponto fixo quando o saldo base é compatível com r−g. Não se mostra dívida nominal com juros reais.',
 sensitivity(p){return `Com b e g fixos, +1 p.p. em r eleva a dívida seguinte em ${F(p.b0/(1+p.g/100)/100)} p.p. do PIB. +1 p.p. de superávit reduz a dívida seguinte em 1 p.p. A reação fiscal só estabiliza desvios se |(1+r)/(1+g)−φb|<1; reação excessiva pode causar oscilações explosivas.`;}

 labor:{name:'Trabalho e salários',title:'O encontro entre oferta e demanda',question:'Como produtividade e preferência por lazer alteram o salário real e o trabalho de equilíbrio?',time:'Equilíbrio parcial · estático',note:'Consumo é mantido exógeno para isolar a oferta de trabalho. Trabalho em unidades normalizadas; não corresponde ao emprego ou ao desemprego medido no Brasil.',

 derive:'A UIP aproximada é i−i*=EΔs+ϱ, com taxas anuais em %. Fixando eᵉ, EΔs=100 ln(eᵉ/e). Logo e=eᵉ exp[−(i−i*−ϱ)/100]. A âncora 5,50 apenas define a origem dos log-desvios: ŝ=100 ln(e/5,50). Substituindo n̂=a_q q̂−a_y ŷ+a_y* ŷ* em ŷ=d+n̂, resulta ŷ=(d+a_q q̂+a_y* ŷ*)/(1+a_y). A renda doméstica é endógena; não há slider duplicado para uma incógnita.',

function eqs(id,p,o){switch(id){
 case 'monetary':return [eq('Demanda · IS','APROXIMAÇÃO','x = xᵉ − (i − πᵉ − rⁿ)/σ + d̄',`x = ${F(p.xe)} − (${F(o.i)} − ${F(p.pe)} − ${F(p.rn)})/${F(p.sigma)} + 2,25 = ${F(o.x)}`),eq('Preços · Phillips','APROXIMAÇÃO','π − π* = β(πᵉ − π*) + κx + ū + u',`π = ${F(p.target)} + ${F(p.beta)}(${F(p.pe)} − ${F(p.target)}) + ${F(p.kappa)} × (${F(o.x)}) + ${F(p.u)} = ${F(o.pi)}%`),eq(p.freeze?'Juro fixado':'Política · Taylor','REGRA DE POLÍTICA',p.freeze?'i = 14 + ε':'i = r* + π* + φπ(π−π*) + φx x + m̄ + ε',p.freeze?`i = 14 + ${F(p.eps)} = ${F(o.i)}%`:`i = 5 + ${F(p.target)} + ${F(p.phi)}(${F(o.pi)} − ${F(p.target)}) + ${F(p.phix)} × (${F(o.x)}) + 3,84 + ${F(p.eps)} = ${F(o.i)}%`)];
 case 'consumption':return [eq('Retorno real · Fisher','IDENTIDADE DE RETORNOS','R = 1+r = (1+i)/(1+πᵉ)',`R = ${F(1+p.i/100,4)} / ${F(1+p.pe/100,4)} = ${F(o.R,4)}; r = ${F(o.r)}%. Aproximação i−πᵉ = ${F(p.i-p.pe)}%.`),eq('Escolha · Euler','OTIMIZAÇÃO','C₁ / C₀ = [βR]^(1/σ) = q',`q = [${F(p.beta)} × ${F(o.R,4)}]^(1/${F(p.sigma)}) = ${F(o.q,4)}`),eq('Recursos nos dois períodos','RESTRIÇÃO ORÇAMENTÁRIA','C₀ + C₁/R = D₀ + W₀ + D₁/R',`${F(o.c0)} + ${F(o.c1)}/${F(o.R,4)} = ${F(o.W)}. S = ${F(o.y0)} + ${F(p.wealth)} − ${F(o.c0)} = ${F(o.s)}; D₀ = ${F(o.y0)}; D₁ = ${F(o.y1)}; C₁ = D₁+RS.`)];
 case 'growth':return [eq('Tecnologia','RELAÇÃO TECNOLÓGICA','yₜ = Aₜ kₜ^α',`A₀ = ${F(p.A)} × (1 + ${F(p.growthShock/100)}) = ${F(o.At)}; y₀ = ${F(o.At)} × ${F(p.k0)}^${F(p.alpha)} = ${F(o.y)}`),eq('Poupança e recursos','REGRA + IDENTIDADE','Iₜ/Lₜ = s yₜ; cₜ = (1−s)yₜ',`I₀/L₀ = ${F(p.s/100)} × ${F(o.y)} = ${F(o.inv)}; c₀ = ${F(o.c)}`),eq('Capital por trabalhador','LEI DE MOVIMENTO','kₜ₊₁ = [(1−δ)kₜ + syₜ]/(1+n)',`k₁ = [(1−${F(p.delta/100,3)}) × ${F(p.k0)} + ${F(o.inv)}]/${F(1+p.n/100,3)} = ${F(o.series[1].k)}`)];
 case 'fiscal':return [eq('Dívida real','IDENTIDADE ORÇAMENTÁRIA','Bₜ₊₁ = (1+r)Bₜ − SPₜ₊₁','B e SP são reais, na mesma unidade. Divide-se por Yₜ₊₁, não por Yₜ.'),eq('Dívida / PIB','IDENTIDADE NORMALIZADA','bₜ₊₁ = [(1+r)/(1+g)]bₜ − sₜ₊₁',`b₁ = ${F((1+p.r/100)/(1+p.g/100),4)} × ${F(p.b0)} − (${F(o.primary)}) = ${F(o.next)}% PIB`),eq('Ajuste do primário','REGRA DE POLÍTICA','sₜ₊₁ = s̄ + φb(bₜ−b*) − eₜ₊₁',`s₁ = ${F(p.s)} + ${F(p.phi)}(${F(p.b0)}−${F(p.target)}) − (${F(o.expense)}) = ${F(o.primary)}% PIB`)];
 case 'labor':return [eq('Produção','RELAÇÃO TECNOLÓGICA','Y = Aᵉᶠ K^α L^(1−α)',`Aᵉᶠ = ${F(p.A)} × (1 + ${F(p.prodShock/100)}) = ${F(o.Aeff)}; Y = ${F(o.Aeff)} × ${F(p.K)}^${F(p.alpha)} × ${F(o.L)}^${F(1-p.alpha)} = ${F(o.Y)}`),eq('Demanda por trabalho','OTIMIZAÇÃO DA FIRMA','w = (1−α)AᵉᶠK^αL^(−α)',`w = ${F(1-p.alpha)} × ${F(o.Y)}/${F(o.L)} = ${F(o.w)}`),eq('Oferta de trabalho','OTIMIZAÇÃO DA FAMÍLIA','w = χ C L^φ',`w = ${F(p.chi)} × ${F(p.C)} × ${F(o.L)}^${F(p.phi)} = ${F(o.w)}`)];
 case 'openEconomy':return [eq('Juros e câmbio · UIP','APROXIMAÇÃO DE EQUILÍBRIO','i − i* = 100 ln(eᵉ/e) + ϱ total',`ϱ total = ${F(p.risk)} + ${F(p.riskShock)} = ${F(o.riskTotal)}; e = ${F(p.ef)} × exp[−(${F(p.i)}−${F(p.istar)}−${F(o.riskTotal)})/100] = ${F(o.e,3)}`),eq('Câmbio real','IDENTIDADE EM LOGS','q̂ = 100 ln(e/5,50) + (p*−p)',`q̂ = ${F(o.logS)} + ${F(p.price)} = ${F(o.q)} log-pontos`),eq('Demanda e setor externo','RELAÇÃO REDUZIDA + FECHAMENTO','n̂ = a_q q̂ − a_y ŷ + a_y* ŷ*; ŷ = d + n̂',`ŷ = [${F(p.d)} + ${F(p.aq)} × (${F(o.q)}) + ${F(p.af)} × ${F(p.ystar)}]/${F(1+p.ay)} = ${F(o.Y)}%; n̂ = ${F(o.nx)} p.p.`)];
 case 'shocks':return [eq('Persistência · AR(1)','PROCESSO · IRF SEM NOVO RUÍDO','zₜ = ρzₜ₋₁ + εₜ',`z₀ = ${F(p.shock/100,4)}; z₁ = ${F(p.rho)} × ${F(p.shock/100,4)} = ${F(o.series[1].z/100,4)}`),eq('Produtividade','TRANSFORMAÇÃO DE VARIÁVEL','Aₜ = Ā exp(zₜ)',`A₀ = ${F(p.A)} × exp(${F(p.shock/100,4)}) = ${F(o.A,4)}`),eq('Produção e recursos','TECNOLOGIA + IDENTIDADE','Yₜ = Aₜ 4^0,35; cₜ = (1−s)Yₜ',`Y₀ = ${F(o.Y)}; Ȳ = ${F(o.Yref)}; desvio = ${F(o.dev)}%; c₀ = ${F(o.c)}`)];
}}
function steps(id,a,b,pa,pb){const d=(key,unit='')=>`${F(a[key])} → ${F(b[key])}${unit} (Δ ${sign(b[key]-a[key])})`;switch(id){
 case 'monetary':return [`O juro nominal, determinado junto com hiato e inflação, passa de ${d('i','%')}. O ε é um deslocamento da regra; +1 p.p. em ε não obriga o juro final a subir exatamente 1 p.p.`,`Com πᵉ=${F(pb.pe)}%, o juro real aproximado de B é ${F(b.i)}−${F(pb.pe)}=${F(b.r)}%. Em A: ${F(a.r)}%.`,`A IS determina o hiato em ${d('x','%')}. O efeito dos juros é avaliado em conjunto com xᵉ e rⁿ.`,`Phillips resulta em inflação ${d('pi','%')}. O termo de custos de B é ${F(pb.u)} p.p.`,`O feedback ${pb.freeze?'está desligado: i=14+ε':'está ativo: Taylor reage a inflação e hiato'}. Estes passos explicam a solução conjunta; não são períodos ou iterações do cálculo.`];
 case 'consumption':return [`Fisher determina o retorno real: ${d('r','% a.a.')}.`,`Euler determina a razão C₁/C₀: ${d('q')}.`,`A riqueza em valor presente é ${d('W',' u.')}. O choque de renda é ${F(pb.incomeShock)}%, ${pb.incomeMode==='permanent'?'nos dois períodos':'somente hoje'}. Juros também alteram o desconto da renda futura.`,`Orçamento e Euler juntos determinam C₀: ${d('c0',' u.')}, e C₁: ${d('c1',' u.')}.`,`A poupança líquida é ${d('s',' u.')}. Valor negativo representa empréstimo permitido pelo modelo.`];
 case 'growth':return [`No ano 0, capital B=${F(pb.k0)} é dado e a produtividade efetiva é ${F(b.At)}. O produto passa de ${d('y',' u./trab.')}.`,`O investimento inicial passa de ${d('inv',' u./trab.')}; consumo presente passa de ${d('c',' u./trab.')}.`,`A acumulação entrega k₁=${F(b.series[1].k)} em B, contra ${F(a.series[1].k)} em A.`,`Ao fim de ${pb.horizon} anos, y é ${d('finalY',' u./trab.')}. O investimento retroage sobre a produção pelo capital.`,`O capital estacionário B é ${b.ks===null?'qualquer nível (sem poupança, depreciação ou diluição)':F(b.ks)}. O resultado ao fim do horizonte não é necessariamente o limite de longo prazo.`];
 case 'fiscal':return [`A dívida inicial é ${F(pb.b0)}% do PIB. O primário da primeira transição é ${F(b.primary)}% do PIB.`,`Juros reais, já divididos pelo PIB seguinte, acrescentam ${F(b.interest)} p.p.; o crescimento contribui ${F(b.dilution)} p.p.`,`Decomposição exata: ${F(pb.b0)} + ${F(b.interest)} + (${F(b.dilution)}) − (${F(b.primary)}) = ${F(b.next)}% PIB.`,`A regra observa a dívida atual e ajusta o primário seguinte. O multiplicador dos desvios é λ=${F(b.lambda,4)}.`,`Ao fim de ${pb.horizon} anos, a dívida passa de ${d('finalB','% PIB')}. Os valores refletem r e g constantes e a regra escolhida, não previsões.`];
 case 'labor':return [`A demanda é o produto marginal do trabalho; a produtividade efetiva é ${F(b.Aeff)} e K=${F(pb.K)} determinam sua posição.`,`A oferta é w=χCL^φ, com χ=${F(pb.chi)}, C=${F(pb.C)} e φ=${F(pb.phi)}.`,`Igualando oferta e demanda, o trabalho de equilíbrio passa de ${d('L',' u.')}.`,`No mesmo ponto, o salário real passa de ${d('w',' u.')}.`,`A produção correspondente é ${d('Y',' u.')}. C permanece exógeno; não se resolve equilíbrio geral.`];
 case 'openEconomy':return [`O diferencial líquido i−i*−ϱ total em B é ${F(pb.i)}−${F(pb.istar)}−${F(b.riskTotal)}=${F(b.dep)} log-pontos de depreciação esperada.`,`Dado eᵉ=${F(pb.ef)} R$/US$, o câmbio atual é ${d('e',' R$/US$')}. Essa conclusão é condicional à expectativa informada.`,`Com os preços relativos dados, o câmbio real passa de ${d('q',' log-pontos')}.`,`As exportações líquidas e a renda se determinam juntas: n̂ ${d('nx',' p.p. do PIB ref.')}.`,`O desvio do produto é ${d('Y','%')}. A renda maior também estimula importações, amortecendo o efeito externo.`];
 case 'shocks':return [`A inovação em B é ε₀=${F(pb.shock)} log-pontos. Ela entra apenas no período 0.`,`No período 1, z₁=${F(pb.rho)}×${F(pb.shock)}=${F(b.series[1].z)} log-pontos.`,`A transformação exponencial gera impacto no produto de ${d('dev','%')}.`,`No período 4, a resposta B é ${pb.horizon>=4?F(b.series[4].dev)+'%':'fora do horizonte escolhido'}. Fatores de produção permanecem fixos.`,`O efeito acumulado entre 0 e ${pb.horizon} é ${F(b.accum)} %-anos. ${pb.shock===0?'Sem impulso, não há resposta.':b.back===Infinity?'O impulso não retorna a 1% da magnitude inicial.':`O log-choque cai a 1% da magnitude inicial após ${b.back} ano(s)${b.back>pb.horizon?', fora do horizonte exibido':''}.`}`];
}}
function status(id,p,o){switch(id){case 'monetary':return {warn:!p.freeze&&p.phi<=1,text:p.freeze?'Juros fixos: a equação de política foi substituída por i=14+ε.':p.phi<=1?'φπ≤1: não há reação mais que proporcional à inflação. Isto não prova indeterminação neste sistema estático.':'φπ>1: princípio de Taylor na parametrização adotada. Não é um teste de estabilidade dinâmica.'};case 'fiscal':return {warn:Math.abs(o.lambda)>=1||o.series.some(v=>Math.abs(v.primary)>10),text:`λ=${F(o.lambda,4)} · ${Math.abs(o.lambda)<1?(o.lambda<0?'convergência oscilatória':'convergência dos desvios'):Math.abs(o.lambda)===1?'caso limítrofe, sem amortecimento dos desvios':'desvios explosivos'}. Ponto fixo: ${o.steady===null?'não único ou inexistente':F(o.steady)+'% PIB'}.${o.series.some(v=>Math.abs(v.primary)>10)?' A regra exige |primário|>10% do PIB no horizonte; plausibilidade fiscal muito limitada.':''}`};case 'growth':return {warn:!Number.isFinite(o.ks),text:o.ks===null?'Todo k é ponto fixo: não há investimento, depreciação ou crescimento do trabalho.':o.ks===Infinity?'Sem estado estacionário finito: o investimento não enfrenta depreciação ou diluição.':`Convergência ${o.ks===0?'para k=0':`para k*=${F(o.ks)}`}. k no horizonte=${F(o.finalK)}; o horizonte finito pode terminar antes da aproximação ao limite.`};case 'shocks':return {warn:Math.abs(p.rho)>=1,text:p.shock===0?'Impulso zero: toda a resposta permanece na referência.':p.rho===1?'Raiz unitária: o efeito deste impulso é permanente.':Math.abs(p.rho)>1?'Resposta explosiva: o efeito aumenta em módulo.':p.rho<0?'Resposta oscilatória e convergente; meia-vida refere-se ao módulo do log-choque.':p.rho===0?'Choque transitório: desaparece já no período 1.':'Resposta convergente; persistência alta pode impedir retorno dentro do horizonte.'};default:return {warn:false,text:id==='consumption'?'Solução interior com consumo positivo nos dois períodos; empréstimos são permitidos.':id==='labor'?'Oferta crescente e demanda decrescente: equilíbrio parcial único nas faixas disponíveis.':'Sistema fechado por eᵉ dado; Y e NX são resolvidos conjuntamente.'};}}

ted">Choque é uma perturbação externa; mudança estrutural altera tecnologia ou preferências; mudança de política altera uma regra. A duração de uma perturbação e a persistência de seus efeitos são conceitos diferentes.</p></details>${studyHTML(id)}</section><div id="kpis" class="kpis" aria-label="Resultados dos cenários"></div><section class="panel"><p class="experiment-label">EXPERIMENTOS GUIADOS · cada botão parte da referência original</p><div class="experiment-row">${l.experiments.map((e,j)=>`<button data-experiment="${j}"><small>${e[2]||'Experimento'}</small>${e[0]}</button>`).join('')}</div>${LESSONS[id].durationKey||id==='shocks'?'<button id="durationPair" class="duration-pair">Montar comparação: A temporário / B duradouro</button><p class="mini muted">Substitui A e B por duas versões de B com a mesma intensidade inicial. Mantém as outras condições.</p>':''}<p id="shockReading" class="shock-reading"></p><p id="changeSummary" class="mini muted" style="margin-top:12px" aria-live="polite"></p></section><section class="panel"><div class="charthead"><h2>${l.graph.title}</h2>${axisControlsHTML(id,s.xAxis)}<label class="mini axis-select">Eixo Y <select id="metric">${l.graph.metrics.map(([k,v])=>`<option value="${k}" ${s.metric===k?'selected':''}>${v}</option>`).join('')}</select></label></div><div id="chart"></div><div id="extraChart"></div><details><summary>Como ler este gráfico?</summary><p>${id==='labor'?'O eixo horizontal mostra trabalho e o vertical, salário real. As interseções marcam os equilíbrios. Diferencie movimento sobre uma curva de deslocamento da curva.':['growth','fiscal','shocks'].includes(id)?'O eixo horizontal mostra os anos. A distância entre as linhas revela a diferença entre os cenários; o último ponto pode estar longe do limite de longo prazo. Compare também os números abaixo.':'O eixo horizontal varia uma hipótese e o vertical mostra o resultado selecionado. Os pontos identificam suas escolhas atuais. Não é um gráfico de evolução ao longo do tempo.'}</p><p>Uma diferença entre A e B só pode ser atribuída a um único fator quando as outras condições forem mantidas iguais. O resumo dos cenários informa tudo o que mudou.</p></details><details><summary>Impacto e comparação nos períodos principais</summary><div id="milestones" class="tablewrap"></div></details><details><summary>Ver números do gráfico</summary><div id="chartTable" class="tablewrap"></div></details></section><section class="panel"><h2>Motor econômico</h2><div id="equations" class="equations"></div><div class="flow">${l.flow.map((v,i)=>`${i?'<b aria-hidden="true">→</b>':''}<span>${v}</span>`).join('')}</div><div id="status"></div><details><summary>Variáveis e unidades</summary><p>${l.definitions}</p><p class="muted">% = percentual; p.p. = pontos percentuais. A mudança de 3% para 4% é +1 p.p., não +1%. Números exibidos são arredondados; cálculos usam precisão completa.</p></details>${id==='monetary'?'<details><summary>Forma matricial · A X = b</summary><div id="matrix" class="mathbox"></div></details>':''}</section><section class="panel"><h2>Como a mudança se transmite</h2><p class="footnote">Comparação A → B. As etapas explicam as dependências; só representam tempo nos modelos dinâmicos.</p><div class="stepactions"><button id="stepBtn" class="primary">Mostrar propagação</button><small id="stepCount"></small></div><ol id="steps" class="steps"></ol></section><section class="panel"><h2>Aprofunde o mecanismo</h2><details><summary>De onde vem este sistema?</summary><p>${l.derive}</p></details><details><summary>Sensibilidade: parcial ou de equilíbrio?</summary><p id="sensitivity"></p></details><details><summary>Hipóteses, limites e equilíbrio</summary><p>${l.limits}</p></details><details><summary>Antes e depois: todas as saídas principais</summary><div id="compareTable" class="tablewrap"></div></details><details><summary>Pergunta para verificar sua compreensão</summary><p>${l.question}</p><p>Identifique o que entra de fora, o que é determinado pelo sistema e qual hipótese sustenta a resposta. Use um experimento e depois modifique apenas um controle.</p></details></section><section class="panel connections"><h2>Conexões com outros laboratórios</h2><p>Conexões conceituais. Nenhum valor é transmitido automaticamente entre módulos.</p>${l.connections.map(k=>`<button data-go="${k}">${laboratories[k].name} →</button>`).join('')}</section></div></div>`;

function table(head,rows){return `<table><thead><tr>${head.map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((x,i)=>i===0?`<th scope="row">${esc(x)}</th>`:`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function axisSpec(id,key){const g=laboratories[id].graph;return g.axes?(g.axes.find(a=>a.key===key)||g.axes[0]):{key:g.key,label:g.x,min:g.min,max:g.max};}
function axisControlsHTML(id,key){const g=laboratories[id].graph;return g.axes?`<label class="mini axis-select">Eixo X <select id="xAxis">${g.axes.map(a=>`<option value="${a.key}" ${a.key===(key||g.axes[0].key)?'selected':''}>${a.label}</option>`).join('')}</select></label>`:'';}
function plotPoints(id,o,metric){const flow=id==='fiscal'&&metric!=='b';return o.series.slice(0,flow?-1:undefined).map(q=>({x:q.t+(flow?1:0),y:q[metric]}));}
function integerTicks(min,max){if(min===max)return [min];const raw=(max-min)/5,scale=10**Math.floor(Math.log10(Math.max(1,raw))),step=[1,2,5,10].map(n=>n*scale).find(n=>n>=raw),ticks=[min];for(let x=Math.ceil(min/step)*step;x<=max;x+=step)if(!ticks.includes(x))ticks.push(x);if(!ticks.includes(max))ticks.push(max);return ticks;}
function wrapAxisLabel(text,limit=31){const lines=[];let line='';for(const word of text.split(' ')){if(line&&(line+' '+word).length>limit){lines.push(line);line=word;}else line+=(line?' ':'')+word;}if(line)lines.push(line);return lines;}

function buildGraph(id,pa,pb,a,b,metric,xKey){const l=laboratories[id],g=l.graph,axis=axisSpec(id,xKey),label=g.metrics.find(m=>m[0]===metric)[1];let xlabel=axis.label,aa=[],bb=[],markers=[],caption='',extra='',integerX=false;
 if(g.labor){const max=Math.max(a.L,b.L)*2.0,min=Math.min(a.L,b.L)*.35,series=[],grid=[...Array.from({length:61},(_,j)=>min+(max-min)*j/60),a.L,b.L].sort((a,b)=>a-b);for(const [name,p,o,dash] of [['A',pa,a,true],['B',pb,b,false]]){const supply=[],demand=[];for(const x of grid){supply.push({x,y:p.chi*p.C*x**p.phi});demand.push({x,y:(1-p.alpha)*o.Aeff*p.K**p.alpha*x**(-p.alpha)});}series.push({name:name+' · oferta',points:supply,color:name==='A'?'#99a8b9':'#c58b29',dash},{name:name+' · demanda',points:demand,color:name==='A'?'#697a99':'#007e79',dash});}

  markers=[{x:axis.key==='real'?a.r:pa[axis.key],y:a[metric],color:'#697a99',label:'A selecionado'},{x:axis.key==='real'?b.r:pb[axis.key],y:b[metric],color:'#007e79',label:'B selecionado'}];caption=`O eixo X varia “${xlabel}”; as outras hipóteses de cada cenário ficam fixas. O eixo Y mostra “${label}”. São curvas de sensibilidade, não evolução no tempo. Pontos: escolhas atuais. Curvas podem coincidir quando muda apenas a posição sobre elas.`;
 }
 if(id==='growth'){const finiteKs=[a.ks,b.ks].filter(v=>Number.isFinite(v)&&v>0),max=Math.max(pa.k0,pb.k0,...finiteKs)*1.6,curves=[];for(const [name,p,o] of [['A',pa,a],['B',pb,b]]){const inv=[],replacement=[];for(let j=0;j<=60;j++){const x=max*j/60;inv.push({x,y:p.s/100*o.Alr*x**p.alpha});replacement.push({x,y:(p.delta+p.n)/100*x});}curves.push({name:name+' · sy',points:inv,dash:name==='A',color:name==='A'?'#697a99':'#007e79'},{name:name+' · (δ+n)k',points:replacement,dash:name==='A',color:name==='A'?'#a1aabc':'#c58b29'});}extra=`<details><summary>Investimento e reposição nas condições de longo prazo</summary>${svgChart(curves,'Capital (unidades por trabalhador)','Investimento e reposição (u. por trabalhador/ano)')}<p class="chart-caption">Aqui o eixo X é o estoque de capital, não o tempo: procura-se a interseção positiva que determina k*. As curvas usam a produtividade de longo prazo e excluem o choque que dura apenas um ano. Consulte o diagnóstico quando não houver ponto fixo positivo finito.</p></details>`;}
 return {html:svgChart([{name:'A · comparação',points:aa,dash:true},{name:'B · em edição',points:bb}],xlabel,label,markers,{integerX})+`<p class="chart-caption">${caption}</p>`,extra,table:table([xlabel,label+' · A',label+' · B','Δ B−A'],aa.map((q,j)=>[F(q.x,integerX?0:2),F(q.y),F(bb[j].y),sign(bb[j].y-q.y)]))};
}

function update(){const id=current,l=laboratories[id],s=state[id];if(!l)return;try{const pa={...s.A,horizon:s.B.horizon},pb=s.B,a=l.solver(pa),b=l.solver(pb);s.last={a,b,pa,pb};
 document.getElementById('kpis').innerHTML=l.metrics.map(([k,label,unit])=>`<div class="kpi"><div class="kpi-label">${label}</div><strong>${F(b[k])}</strong><span class="unit">${unit}</span><small>A ${F(a[k])} · Δ ${Number.isFinite(a[k])&&Number.isFinite(b[k])?sign(b[k]-a[k]):'não finito'}</small></div>`).join('');
 const changed=l.params.filter(q=>Math.abs(pa[q.key]-pb[q.key])>1e-9).map(q=>`${q.label}: ${F(pa[q.key])} → ${F(pb[q.key])}${q.unit?' '+q.unit:''}`);if(pa.freeze!==pb.freeze)changed.push(pb.freeze?'Reação de Taylor desligada':'Reação de Taylor ligada');
 const durationKey=LESSONS[id].durationKey;if(durationKey&&pa[durationKey]!==pb[durationKey])changed.push('Duração: '+LESSONS[id].durationOptions.find(v=>v[0]===pa[durationKey])[1]+' → '+LESSONS[id].durationOptions.find(v=>v[0]===pb[durationKey])[1]);
 document.getElementById('shockReading').textContent=shockReading(id,pb,b);
 document.getElementById('changeSummary').textContent=changed.length?`B difere de A em ${changed.length} ${changed.length===1?'hipótese':'hipóteses'}: ${changed.join('; ')}.`:'A e B coincidem. Escolha um experimento ou mova um controle para observar o mecanismo.';
 document.getElementById('avalues').innerHTML=table(['Entrada','Cenário A'],[...l.params.map(q=>[q.label,F(pa[q.key])+' '+q.unit]),...(durationKey?[[LESSONS[id].durationLabel,LESSONS[id].durationOptions.find(v=>v[0]===pa[durationKey])[1]]]:[])]);
 document.getElementById('equations').innerHTML=eqs(id,pb,b).map(e=>`<div class="equation"><span class="tag">${e.type}</span><div class="eqtitle">${e.name}</div><div class="formula">${e.formula}</div><div class="numeric">${e.numeric}</div></div>`).join('');
 const st=status(id,pb,b);document.getElementById('status').innerHTML=`<div class="status ${st.warn?'warn':''}">${st.text}</div>`;
 document.getElementById('sensitivity').textContent=l.sensitivity(pb,b);
 document.getElementById('compareTable').innerHTML=table(['Variável','Unidade','A','B','Δ B−A'],l.metrics.map(([key,name,unit])=>[name,unit,F(a[key]),F(b[key]),Number.isFinite(a[key])&&Number.isFinite(b[key])?sign(b[key]-a[key]):'—']));
 const pointsA=b.series?plotPoints(id,a,s.metric):[],pointsB=b.series?plotPoints(id,b,s.metric):[],periods=pointsB.filter(q=>[0,1,4,pb.horizon].includes(q.x));document.getElementById('milestones').innerHTML=b.series?table(['Ano',l.graph.metrics.find(v=>v[0]===s.metric)[1]+' · A','B','Δ B−A'],periods.map(q=>{const av=pointsA.find(v=>v.x===q.x).y;return [String(q.x),F(av),F(q.y),sign(q.y-av)];})):table(['Resultado','A','B'],l.metrics.map(([k,name])=>[name,F(a[k]),F(b[k])]));
 const graph=buildGraph(id,pa,pb,a,b,s.metric,s.xAxis);document.getElementById('chart').innerHTML=graph.html;document.getElementById('chartTable').innerHTML=graph.table;document.getElementById('extraChart').innerHTML=graph.extra;
 if(id==='monetary')document.getElementById('matrix').textContent=`X = [x, π, i]ᵀ\n\nA =\n${b.A.map(row=>'[ '+row.map(x=>F(x,4).padStart(9)).join('  ')+' ]').join('\n')}\n\nb = [ ${b.b.map(x=>F(x,4)).join('; ')} ]ᵀ\n\nX = [ ${[b.x,b.pi,b.i].map(x=>F(x,4)).join('; ')} ]ᵀ\nResíduo máximo |AX−b|: ${b.residual.toExponential(2)}\n\nEsta matriz é do sistema estático, não da dinâmica de expectativas.`;
 renderSteps();
 }catch(error){document.getElementById('kpis').innerHTML=`<div class="notice warn" role="alert">${esc(error.message)}</div>`;}}
function renderSteps(){const s=state[current];if(!s?.last)return;const {a,b,pa,pb}=s.last;const list=steps(current,a,b,pa,pb);document.getElementById('steps').innerHTML=list.map((text,i)=>`<li class="${i<s.step?'':'hidden'}"><strong>${i+1}.</strong> ${text}</li>`).join('');document.getElementById('stepCount').textContent=s.step?`${s.step} de ${list.length} etapas`:'';document.getElementById('stepBtn').textContent=s.step===0?'Mostrar propagação':s.step>=list.length?'Recomeçar explicação':'Próxima etapa →';}
function overview(){current='overview';document.querySelectorAll('[data-lab]').forEach(e=>{e.classList.remove('active');e.setAttribute('aria-current','false');});document.getElementById('main').innerHTML=`<div class="eyebrow">MAPA DOS MECANISMOS</div><h1>Sete sistemas. Uma economia.</h1><details class="panel lesson"><summary>Como as tradições macroeconômicas se relacionam?</summary><p>“Clássicas”, no sentido de teorias consagradas, reúne tradições diferentes. Os mecanismos aqui não pertencem todos à escola clássica. Crescimento de Solow e produtividade marginal do trabalho são neoclássicos; escolha intertemporal conecta-se a Fisher e às ideias de suavização e renda permanente; política monetária usa uma simplificação novo-keynesiana, com preços que se ajustam lentamente.</p><p>A identidade fiscal é uma restrição contábil, não uma escola econômica. O módulo aberto combina retornos esperados e demanda externa. Processos de choques são ferramentas de dinâmica usadas por diferentes tradições. Modelos completos de Keynes, de ciclos reais, de renda permanente ou Mundell–Fleming não estão sendo resolvidos aqui.</p><p>Para começar, estude consumo, trabalho e crescimento; depois política monetária, câmbio e dívida. Use o laboratório de choques para distinguir impacto, persistência e longo prazo. Em cada módulo, abra “Entenda este mecanismo” para ler sem fórmulas.</p></details><p class="lead">Cada laboratório isola um mecanismo. As conexões abaixo são conceituais: as equações não formam um modelo integrado do Brasil.</p><div class="overview-grid">${Object.entries(laboratories).map(([id,l],j)=>`<button class="overview-card" data-go="${id}"><span class="eyebrow">0${j+1} · ${l.time}</span><strong>${l.name} ↗</strong><p>${l.question}</p><span class="mini">Conecta-se a: ${l.connections.map(k=>laboratories[k].name).join(' · ')}</span></button>`).join('')}</div>
 <section id="sources" class="panel prose"><div class="eyebrow">BRASIL · CONSULTA EM 06/09/2026</div><h2>O que é observado, o que é hipótese</h2><p>Os valores abaixo são um retrato das divulgações verificadas disponíveis na consulta. Datas de referência diferem: não existe um conjunto de variáveis macroeconômicas todas medidas “hoje”. O arquivo não atualiza dados automaticamente.</p><div class="sourcegrid"><div class="panel"><span class="mini">Meta Selic</span><strong>14,00%</strong><small>a.a. · decisão de 05/08/2026</small></div><div class="panel"><span class="mini">IPCA em 12 meses</span><strong>4,44%</strong><small>até julho de 2026</small></div><div class="panel"><span class="mini">Meta contínua</span><strong>3,00%</strong><small>tolerância de ±1,50 p.p.</small></div><div class="panel"><span class="mini">Dívida líquida · DLSP</span><strong>69,1%</strong><small>do PIB · julho de 2026</small></div></div>
 <div class="tablewrap"><table class="source-table"><thead><tr><th>Variável e fonte</th><th>Referência</th><th>Uso no simulador</th></tr></thead><tbody><tr><td><a href="${SOURCES.selic}" target="_blank" rel="noopener">BCB · decisão do Copom</a></td><td>14,00% a.a.; 05/08/2026, vigência desde 06/08</td><td>Juro de partida em política monetária, consumo e economia aberta.</td></tr><tr><td><a href="${SOURCES.ipca}" target="_blank" rel="noopener">Ministério da Fazenda / SPE · dados do IBGE</a></td><td>IPCA: 0,07% no mês e 4,44% em 12 meses; jul/2026</td><td>4,44% ancora o nível inicial da inflação monetária. Não é expectativa. Informativo oficial confirma o resultado do IBGE.</td></tr><tr><td><a href="${SOURCES.meta}" target="_blank" rel="noopener">BCB · meta contínua</a></td><td>3,00%; faixa 1,50–4,50%</td><td>Meta inicial da regra. A faixa de tolerância não vira uma função automática do modelo.</td></tr><tr><td><a href="${SOURCES.fiscal}" target="_blank" rel="noopener">BCB · estatísticas fiscais, nota de 31/08/2026</a></td><td>DLSP 69,1%; primário −0,67% do PIB em 12 meses até jul/2026</td><td>Referência do setor público consolidado no laboratório fiscal. A DBGG de 82,5% é outro conceito e não é misturada a esta dívida líquida.</td></tr></tbody></table></div>
 <h2>Hipóteses declaradas</h2><p>Inflação esperada de 4,50%, juro natural de 5%, juro real fiscal de 6%, crescimento futuro de 2%, juro externo de 4% e câmbio futuro de R$5,50 são <strong>valores didáticos</strong>, não estimativas atuais verificadas. Renda, trabalho, capital, produtividade, preferências e elasticidades são normalizados. Não se substitui expectativa pelo IPCA realizado, nem custo efetivo da dívida pela Selic.</p><p>A referência monetária tem resíduos constantes que conciliam seus níveis de partida; isso é uma calibração de interceptos para ensino, não evidência de que o modelo descreva o Brasil. O cenário A é apenas uma comparação e pode ser salvo em qualquer ponto; não significa estado estacionário.</p>
 <h2>Ampliação didática</h2><p>Todos os laboratórios possuem leitura opcional sem fórmulas, glossário e roteiro com pergunta e resposta recolhida. Choques têm controles separados e podem ser retirados sem apagar mudanças estruturais. Consumo compara renda presente e duradoura; crescimento compara produtividade pontual e permanente; dívida compara despesa pontual e recorrente. Nos sistemas estáticos, o impacto é identificado sem inventar uma dinâmica.</p><h2>Revisão da especificação</h2><ol><li><strong>Taylor:</strong> adotou-se i=r*+π*+φπ(π−π*)+φx x+m̄+ε. O coeficiente total de inflação é φπ. Na fórmula do anexo era 1+φπ; o alerta φπ&lt;1 era incompatível com ela.</li><li><strong>Expectativas e dinâmica:</strong> expectativas dadas fecham o módulo monetário estático. Eliminadas IRFs, “velocidade de retorno” e diagnósticos de indeterminação nesse módulo. IRFs permanecem no módulo de choques; crescimento e dívida têm recorrências explícitas.</li><li><strong>Inflação de referência:</strong> Phillips usa desvios da meta, com intercepto explícito. Um ponto inicial observado não é tratado automaticamente como estado estacionário.</li><li><strong>Consumo:</strong> riqueza inicial incluída no orçamento; Fisher exato; não se promete que juros maiores sempre reduzam o nível de consumo presente.</li><li><strong>Fiscal:</strong> índices temporais e denominador do primário definidos. Juros reais combinados com crescimento real. O saldo estabilizador é exato nesta convenção. Removidos os controles redundantes de gasto, receita e saldo e a dívida nominal inconsistente com juros reais.</li><li><strong>Trabalho:</strong> o fechamento é de equilíbrio parcial, condicionado ao consumo. A elasticidade com consumo fixo é 1/φ. Não se promete explicar desemprego.</li><li><strong>Câmbio:</strong> expectativa futura exógena fecha a UIP. Retirados sliders do câmbio atual e da renda doméstica, que agora são resultados. Níveis e log-desvios têm unidades separadas.</li><li><strong>Choques:</strong> usa-se log(A/Ā), impulso único e persistência explícita. Eliminados variância, frequência e duração redundantes, que atrapalhavam a comparação.</li><li><strong>Menor custo e complexidade:</strong> três modos de dificuldade substituídos por seções expansíveis; “congelar” e “remover” reunidos na substituição da regra de Taylor por juros fixos. Sem DSGE integrado, animações automáticas, contas, backend ou atualização ao vivo. Gráficos e matemática nativos, sem bibliotecas externas.</li><li><strong>Preservado:</strong> sete laboratórios, cenários A/B, equações identificadas, substituições numéricas, diagramas, explicação em etapas, experimentos, sensibilidade, derivações, limites, horizontes e tabelas acessíveis.</li></ol>
 <h2>Leituras de apoio</h2><p><a href="${SOURCES.taylor}" target="_blank" rel="noopener">Federal Reserve · princípio de Taylor</a> · <a href="${SOURCES.debt}" target="_blank" rel="noopener">FMI · juros, crescimento e dívida</a>. As equações e hipóteses específicas usadas neste arquivo estão documentadas dentro de cada laboratório.</p>
 <h2>Como usar</h2><p>Abra um laboratório, aplique um experimento e compare A com B. Use “Mostrar propagação” para revelar a explicação; abra as seções matemáticas para conferir as contas. Para criar sua própria base de comparação, pressione “Usar B como cenário A”. “Restaurar laboratório” repõe ambos. O horizonte de B é usado para calcular os dois cenários na mesma janela.</p><p>O HTML funciona por duplo clique, sem instalação e sem conexão. Só os links das fontes precisam de internet. Alterações ficam na memória desta página; recarregar restaura os valores iniciais. As comparações entre cenários não medem bem-estar nem recomendam políticas.</p></section>`;document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>showLab(e.dataset.go,true));document.getElementById('main').focus();}
