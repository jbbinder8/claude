<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:        #f3ecdc;
      --bg-card:   #faf6ec;
      --ink:       #122418;
      --ink-soft:  #4a5a4e;
      --line:      #d8cfba;
      --accent:    #c4452f;
      --accent-2:  #2f6d4a;
      --gold:      #d4a93b;
      --shadow:    0 1px 0 rgba(18,36,24,.06);
      --radius:    10px;
    }

    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:'IBM Plex Sans', system-ui, sans-serif;
      background:var(--bg);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      background-image:
        radial-gradient(circle at 12% 8%, rgba(196,69,47,.06), transparent 40%),
        radial-gradient(circle at 88% 92%, rgba(47,109,74,.07), transparent 45%);
      min-height:100vh;
      padding-bottom:64px;
    }

    .wrap{max-width:920px;margin:0 auto;padding:32px 20px}

    /* ---------- header ---------- */
    header.top{
      display:flex;flex-direction:column;gap:14px;
      padding-bottom:22px;border-bottom:1px solid var(--line);
      margin-bottom:28px;
    }
    .eyebrow{
      font-family:'IBM Plex Mono', monospace;
      font-size:11px;letter-spacing:.22em;text-transform:uppercase;
      color:var(--accent);font-weight:600;
    }
    h1{
      font-family:'Archivo Black', sans-serif;
      font-size:clamp(34px,5.4vw,52px);
      line-height:.92;letter-spacing:-.02em;
      margin:0;color:var(--ink);
      text-transform:uppercase;
    }
    h1 .crown{color:var(--accent)}
    .nav-back{
      font-family:'IBM Plex Mono', monospace;
      font-size:11px;letter-spacing:.16em;text-transform:uppercase;
      color:var(--accent-2);font-weight:600;
      text-decoration:none;
      display:inline-flex;align-items:center;gap:6px;
    }
    .nav-back:hover{text-decoration:underline;text-underline-offset:3px}

    /* ---------- estados ---------- */
    .state{
      text-align:center;padding:60px 20px;color:var(--ink-soft);
      font-size:14px;
    }
    .state .spinner{
      width:24px;height:24px;border-radius:50%;
      border:2px solid var(--line);border-top-color:var(--accent);
      animation:spin 0.8s linear infinite;margin:0 auto 14px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ---------- tabela de palpites ---------- */
    .section-label{
      font-family:'IBM Plex Mono', monospace;
      font-size:11px;letter-spacing:.22em;text-transform:uppercase;
      color:var(--ink-soft);font-weight:600;
      margin-bottom:14px;
      display:flex;align-items:center;gap:10px;
    }
    .section-label::after{
      content:"";flex:1;height:1px;background:var(--line);
    }

    .rank-list{
      display:flex;flex-direction:column;gap:8px;
    }
    .rank-row{
      display:grid;
      grid-template-columns:36px 1fr auto auto;
      align-items:center;
      gap:12px;
      background:var(--bg-card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:12px 16px;
      box-shadow:var(--shadow);
    }
    .rank-row.top1{border-left:4px solid var(--gold)}
    .rank-row.top2{border-left:4px solid #b0b0b0}
    .rank-row.top3{border-left:4px solid #a0714a}

    .rank-pos{
      font-family:'Archivo Black', sans-serif;
      font-size:18px;color:var(--ink-soft);
      text-align:center;
    }
    .rank-row.top1 .rank-pos{color:var(--gold)}
    .rank-row.top2 .rank-pos{color:#888}
    .rank-row.top3 .rank-pos{color:#a0714a}

    .rank-nome{
      font-weight:600;font-size:15px;color:var(--ink);
    }
    .rank-bar-wrap{
      width:120px;
    }
    .rank-bar-bg{
      height:6px;border-radius:3px;background:var(--line);overflow:hidden;
    }
    .rank-bar-fill{
      height:100%;border-radius:3px;background:var(--accent-2);
      transition:width .4s ease;
    }
    .rank-count{
      font-family:'Archivo Black', sans-serif;
      font-size:16px;color:var(--ink);
      text-align:right;
      white-space:nowrap;
    }
    .rank-count span{
      font-family:'IBM Plex Mono', monospace;
      font-size:11px;font-weight:600;color:var(--ink-soft);
      margin-left:3px;
    }

    /* ---------- footer ---------- */
    footer.foot{
      margin-top:40px;padding-top:20px;
      border-top:1px solid var(--line);
      font-family:'IBM Plex Mono', monospace;
      font-size:11px;letter-spacing:.1em;text-transform:uppercase;
      color:var(--ink-soft);text-align:center;
    }

    @media (max-width:560px){
      .rank-bar-wrap{display:none}
      .rank-row{grid-template-columns:36px 1fr auto}
    }
  </style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">Copa do Mundo • 2026</div>
    <h1>Bolão <span class="crown">★</span> da Copa</h1>
    <a class="nav-back" id="link-palpites" href="#">← Palpites</a>
  </header>

  <div class="section-label">Palpites registrados</div>

  <main id="content">
    <div class="state">
      <div class="spinner"></div>
      Carregando…
    </div>
  </main>

  <footer class="foot">estatísticas · bolão da copa 2026</footer>
</div>

<script>
// Link de volta para a página principal (mesma URL sem ?page=stats)
document.getElementById('link-palpites').href =
  window.location.href.replace(/[?&]page=stats/, '').replace(/\?$/, '');

window.addEventListener('DOMContentLoaded', function() {
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(function(err) {
      document.getElementById('content').innerHTML =
        '<div class="state" style="color:#a8302a">Erro: ' +
        escapeHtml(String(err && err.message || err)) + '</div>';
    })
    .getEstatisticas();
});

function render(data) {
  const usuarios   = data.usuarios   || [];
  const totalJogos = data.totalJogos || 0;
  const content    = document.getElementById('content');

  if (!usuarios.length) {
    content.innerHTML = '<div class="state">Nenhum palpite registrado ainda.</div>';
    return;
  }

  const maxTotal = usuarios[0].total;

  const rows = usuarios.map(function(u, i) {
    const pos    = i + 1;
    const pct    = maxTotal > 0 ? Math.round((u.total / maxTotal) * 100) : 0;
    const classe = pos === 1 ? ' top1' : pos === 2 ? ' top2' : pos === 3 ? ' top3' : '';
    const deLabel = totalJogos > 0 ? '<span>/ ' + totalJogos + '</span>' : '';
    return '<div class="rank-row' + classe + '">' +
      '<div class="rank-pos">' + pos + '</div>' +
      '<div class="rank-nome">' + escapeHtml(u.nome) + '</div>' +
      '<div class="rank-bar-wrap">' +
        '<div class="rank-bar-bg">' +
          '<div class="rank-bar-fill" style="width:' + pct + '%"></div>' +
        '</div>' +
      '</div>' +
      '<div class="rank-count">' + u.total + deLabel + '</div>' +
    '</div>';
  }).join('');

  content.innerHTML = '<div class="rank-list">' + rows + '</div>';
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
